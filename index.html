<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        இந்திய வரலாற்று இடங்கள் - Interactive Map
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- =====================================
     HEADER
====================================== -->

<header class="app-header">

    <div class="header-title">
         இந்திய வரலாற்று இடங்கள்<br>
       
    </div>

    <div class="header-subtitle">
       அரசு மேல்நிலைப்பள்ளி கூடநகரம் –  8ஆம் வகுப்பு – சமூக அறிவியல்
    </div>

</header>



<!-- =====================================
     MAIN APPLICATION
====================================== -->

<main class="app-container">


    <!-- =================================
         LEFT SIDEBAR
    ================================== -->

    <aside class="sidebar">

        <h2>
            📍 வரலாற்று இடங்கள்
        </h2>


        <!-- SEARCH -->

        <div class="search-area">

            <input
                type="text"
                id="searchBox"
                placeholder="இடத்தைத் தேடுக..."
                autocomplete="off">

        </div>


        <!-- PLACE LIST -->

        <div class="list-container">

            <ul id="placeList">
                <!-- places.json மூலம் பட்டியல் வரும் -->
            </ul>

        </div>

    </aside>



    <!-- =================================
         MAP SECTION
    ================================== -->

    <section class="map-section">


        <!-- MAP TOOLBAR -->

        <div class="map-toolbar">

            <button
                id="zoomIn"
                type="button"
                title="Zoom In">
                ＋
            </button>


            <button
                id="zoomOut"
                type="button"
                title="Zoom Out">
                －
            </button>


            <button
                id="resetMap"
                type="button">
                Reset
            </button>


            

        </div>



        <!-- =================================
             MAP CONTAINER
        ================================== -->

        <div id="mapContainer">


            <!-- INDIA MAP -->

            <img
                id="indiaMap"
                src="India-map.svg"
                alt="இந்திய வரைபடம்">


            <!-- MARKER -->

            <div
                id="marker"
                aria-hidden="true">
            </div>


            <!-- =================================
                 INFORMATION POPUP
            ================================== -->

            <div
                id="popup"
                role="dialog"
                aria-live="polite">


                <button
                    id="closePopup"
                    type="button"
                    title="Close">
                    ×
                </button>


                <h3 id="popupTitle">
                    வரலாற்று இடம்
                </h3>


                <div id="popupInfo">
                    இடத்தைத் தேர்ந்தெடுக்கவும்.
                </div>


            </div>


        </div>


        <!-- =================================
             COORDINATE PICKER
        ================================== -->

       

    </section>


</main>



<!-- =====================================
     FOOTER
====================================== -->

<footer class="app-footer">

    <span>
        India Interactive Historical Map
    </span>

    <span>
        | Class VIII Social Science
    </span>

</footer>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="script.js"></script>



</body>

</html>
